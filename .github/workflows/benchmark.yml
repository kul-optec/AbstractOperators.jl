name: Benchmark this PR
# Stage 1 (fork-safe): runs with read-only permissions, uploads results as an
# artifact.  Stage 2 (post_benchmark_comment.yml) picks up the artifact and
# posts the PR comment with write permissions.
on:
  pull_request:
    branches: [ master ]

# No write permissions needed here – the comment is posted by the separate
# post_benchmark_comment.yml workflow_run job.

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # Check out HEAD commit of the PR (the code under review)
      # ------------------------------------------------------------------
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0     # needed so we can also check out base SHA

      # ------------------------------------------------------------------
      # Check out the merge-base / target branch (master) as "base"
      # ------------------------------------------------------------------
      - name: Check out base (master)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # ------------------------------------------------------------------
      # Julia + package cache
      # ------------------------------------------------------------------
      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      # ------------------------------------------------------------------
      # Instantiate the benchmark sub-project (installs all deps declared
      # in benchmark/Project.toml, including ArgParse and BenchmarkTools).
      # ------------------------------------------------------------------
      - name: Instantiate benchmark project
        shell: bash
        run: julia --project=head/benchmark -e 'using Pkg; Pkg.instantiate()'

      # ------------------------------------------------------------------
      # Run the repo-local comparison driver
      # ------------------------------------------------------------------
      - name: Run benchmark comparison
        shell: bash
        # No JULIA_NUM_THREADS here: it would only affect this driver process, not the
        # subprocesses it spawns -- see `run_suite`'s docstring in compare.jl for how those
        # get pinned instead (`-t`, once per count in `--threads`).
        #
        # No OPENBLAS_NUM_THREADS either, and this is load-bearing rather than an omission.
        # Setting any of OPENBLAS_NUM_THREADS / GOTO_NUM_THREADS / OMP_NUM_THREADS makes
        # LinearAlgebra's `__init__` skip its own `BLAS.set_num_threads` entirely, so one set
        # here would pin BLAS for the whole run and make `MatrixOp`/`LMatrixOp` measure
        # something other than what a user gets.
        #
        # What they do get: BLAS is initialised to `max(1, jl_effective_threads() ÷ 2)`,
        # which follows the *machine* (and CPU affinity), never Julia's `-t`. On the 4-vCPU
        # ubuntu-latest runner that is 2 BLAS threads at both `-t 1` and `-t 2`, which is why
        # these two rows are comparable for the BLAS-backed operators. A `mul!` on those
        # operators leaves that setting alone unless it was constructed `threaded = false`,
        # in which case it runs inside `with_restricted_threads` (see the BLAS bridge section
        # of `threading_policy.jl` for why the permitted branch opens no scope at all).
        #
        # Oversubscription at `-t 2` is therefore bounded by the runner having 4 vCPUs, not
        # by the library clamping BLAS. On a many-core machine running Julia-threaded
        # operators alongside BLAS ones, prefer OPENBLAS_NUM_THREADS=1 (see AGENTS.md).
        run: |
          julia --project=head/benchmark head/benchmark/compare.jl \
            --base-dir  "${{ github.workspace }}/base" \
            --head-dir  "${{ github.workspace }}/head" \
            --output-dir artifact \
            --pr        "${{ github.event.pull_request.number }}" \
            --julia-version "$(julia -e 'print(VERSION)')" \
            --threads 1,2

      # ------------------------------------------------------------------
      # Upload artifact for stage-2 comment posting
      # ------------------------------------------------------------------
      - name: Upload benchmark comment artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comment-1
          path: |
            artifact/body.md
            artifact/pr_number.txt
            artifact/julia_version.txt
