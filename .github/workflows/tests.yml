name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.julia-arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version: ['lts', '1']
        julia-arch: [x64]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    env:
      JULIA_NUM_THREADS: 2

    # needed to allow julia-actions/cache to delete old caches that it has created
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v2
      - name: Prepare LTS test environment
        if: matrix.julia-version == 'lts'
        shell: bash
        run: |
          julia --project=test -e '
            using Pkg
            Pkg.rm(["DSPOperators", "FFTWOperators", "NFFTOperators", "WaveletOperators"])
            Pkg.develop(path = pwd())
            for pkg in ("DSPOperators", "FFTWOperators", "NFFTOperators", "WaveletOperators")
                Pkg.develop(path = joinpath(pwd(), pkg))
            end
            # test/Project.toml pins GPUEnv away from the broken 0.2.1 and tries to test
            # the unreleased fix (hakkelt/GPUEnv.jl#6) via a `[sources]` entry -- but
            # `[sources]` needs Pkg >= 1.11, and this is the Julia 1.10 (LTS) job, the
            # only matrix leg that actually hits the bug (reproduced locally: pinning
            # GPUEnv exactly to 0.2.1 fails `using DSPOperators` after
            # `GPUEnv.activate(; persist = true)` on Julia 1.10, but not on 1.12).
            # `[sources]` silently no-ops there instead of erroring, so the pin would
            # otherwise go untested on the one job it matters for. `Pkg.add(url=, rev=)`
            # is old, stable API that works on every supported Julia version, so
            # duplicate that pin here imperatively for this job specifically.
            Pkg.add(Pkg.PackageSpec(name = "GPUEnv", url = "https://github.com/hakkelt/GPUEnv.jl.git", rev = "fix-instantiate-skip-after-develop"))
            Pkg.instantiate()
            Pkg.build()
            Pkg.precompile()
          '
      - uses: julia-actions/julia-buildpkg@v1
        if: matrix.julia-version != 'lts'
      - name: Run tests on LTS
        if: matrix.julia-version == 'lts'
        run: julia --project=test --check-bounds=yes --compiled-modules=yes --depwarn=yes --code-coverage=user test/runtests.jl
      - uses: julia-actions/julia-runtest@v1
        if: matrix.julia-version != 'lts'
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        # Upload coverage only from one job (Linux, Julia latest version)
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        with:
          files: lcov.info
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
